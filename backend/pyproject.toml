[project]
name = "aion-tutor-backend"
version = "2.0.0"
description = "Aion Tutor — ADK + Supabase pgvector backend"
requires-python = ">=3.11"
dependencies = [
    # Google AI stack
    "google-genai>=1.9.0",
    "google-adk[a2a]>=1.19.0",
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "websockets>=12.0",
    # HTTP
    "httpx>=0.27.0",
    "aiohttp>=3.9.5",
    # Utilities
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "colorama>=0.4.6",
    "coloredlogs>=15.0.1",
    # MCP registry (kept for backward compat)
    "mcp>=1.2.0",
    "a2a-sdk[http-server]>=0.3.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "aion_tutor",
    "shared",
    "agents",
    "mcp_server",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
